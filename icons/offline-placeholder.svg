<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b53f"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="8"/>
  
  <!-- Decorative Grid / Shapes -->
  <circle cx="530" cy="70" r="140" fill="#00b53f" opacity="0.04"/>
  <circle cx="70" cy="330" r="110" fill="#0f172a" opacity="0.03"/>
  
  <!-- Central Card -->
  <rect x="180" y="80" width="240" height="240" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Property House Silhouette -->
  <g transform="translate(300, 165) scale(1.1)">
    <!-- House outline -->
    <path d="M -40 10 L 0 -26 L 40 10 L 40 42 C 40 45 37 48 34 48 L -34 48 C -37 48 -40 45 -40 42 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <!-- Roof peak -->
    <path d="M -48 14 L 0 -26 L 48 14" fill="none" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Door -->
    <rect x="-10" y="20" width="20" height="28" rx="3" fill="#cbd5e1"/>
    <!-- Window -->
    <rect x="-24" y="2" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="10" y="2" width="14" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="20" y="-18" width="8" height="14" fill="#94a3b8" rx="1"/>
  </g>
  
  <!-- Offline Cloud / Wifi Badge -->
  <g transform="translate(370, 120)">
    <circle cx="0" cy="0" r="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M -8 -4 C -8 -7 -4 -9 0 -9 C 4 -9 7 -7 7 -4 C 10 -4 11 -2 11 0 C 11 3 9 5 6 5 L -6 5 C -9 5 -10 3 -10 0 C -10 -2 -9 -4 -8 -4 Z" fill="#ef4444"/>
    <line x1="-7" y1="-8" x2="7" y2="6" stroke="#991b1b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text Labels -->
  <text x="300" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#334155">
    Photo Cached Offline
  </text>
  <text x="300" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#64748b">
    Connect to internet for HD gallery
  </text>
  
  <!-- Brand Watermark -->
  <g transform="translate(300, 360)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
      KEJAMARKET.CO.KE
    </text>
  </g>
</svg>
