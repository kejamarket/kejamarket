<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Block search engines from indexing internal admin system -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  
  <title>Admin Dashboard - Internal System</title>
  <link rel="stylesheet" href="css/style.css?v=3.1">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=2.1">
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Enhanced Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-header">
      <h2>
        <i class="fas fa-building"></i>
        KejaMarket Admin
      </h2>
    </div>
    
    <nav id="admin-nav-menu">
      <!-- 1. Dashboard Home -->
      <div class="sidebar-section">
        <button class="admin-nav-btn active" data-module="dashboard" data-rbac="any">
          <i class="fas fa-chart-line nav-icon"></i>
          <span>Dashboard</span>
        </button>
      </div>

      <!-- 2. Listings (Gatekeeper & Moderation) -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Listings Moderation</div>
        <button class="admin-nav-btn" data-module="verification" data-view="pending" data-rbac="listings,super">
          <i class="fas fa-clock nav-icon" style="color:#f59e0b;"></i>
          <span>Pending Approval</span>
          <span class="admin-badge" id="badge-pending-listings" style="display:none; margin-left:auto; background:#f59e0b; color:#fff; border-radius:10px; padding:2px 7px; font-size:11px; font-weight:700;">0</span>
        </button>
        <button class="admin-nav-btn" data-module="properties" data-rbac="listings,super">
          <i class="fas fa-home nav-icon"></i>
          <span>Properties</span>
        </button>
        <button class="admin-nav-btn" data-module="services" data-rbac="listings,super">
          <i class="fas fa-tools nav-icon"></i>
          <span>Services</span>
        </button>
        <button class="admin-nav-btn" data-module="marketplace" data-rbac="listings,super">
          <i class="fas fa-shopping-bag nav-icon"></i>
          <span>Marketplace</span>
        </button>
        <button class="admin-nav-btn" data-module="listings-reported" data-rbac="listings,super">
          <i class="fas fa-flag nav-icon" style="color:#ef4444;"></i>
          <span>Reported / Flagged</span>
          <span class="admin-badge" id="badge-reported-listings" style="display:none; margin-left:auto; background:#ef4444; color:#fff; border-radius:10px; padding:2px 7px; font-size:11px; font-weight:700;">0</span>
        </button>
      </div>

      <!-- 3. User & Identity Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Users & Identity</div>
        <button class="admin-nav-btn" data-module="users" data-rbac="users,super">
          <i class="fas fa-users nav-icon"></i>
          <span>All Users</span>
        </button>
        <button class="admin-nav-btn" data-module="users-verified" data-rbac="users,verification,super">
          <i class="fas fa-user-check nav-icon" style="color:#10b981;"></i>
          <span>Verified Users</span>
        </button>
        <button class="admin-nav-btn" data-module="users-suspended" data-rbac="users,super">
          <i class="fas fa-user-slash nav-icon" style="color:#dc2626;"></i>
          <span>Suspended / Banned</span>
        </button>
      </div>

      <!-- 4. House Hunt Concierge -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Concierge</div>
        <button class="admin-nav-btn" data-module="house-hunts" data-rbac="support,super">
          <i class="fas fa-search-location nav-icon"></i>
          <span>House Hunts</span>
          <span class="admin-badge" id="admin-hunts-count" style="display:none; margin-left:auto; background:#10b981; color:#fff; border-radius:10px; padding:2px 7px; font-size:11px;">0</span>
        </button>
      </div>

      <!-- 5. Buildings & Unit Portfolios -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Portfolios</div>
        <button class="admin-nav-btn" data-module="buildings" data-rbac="listings,super">
          <i class="fas fa-building nav-icon"></i>
          <span>Buildings</span>
        </button>
        <button class="admin-nav-btn" data-module="units" data-rbac="listings,super">
          <i class="fas fa-door-open nav-icon"></i>
          <span>Units</span>
        </button>
      </div>

      <!-- 6. Communications & Broadcasts -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Communications</div>
        <button class="admin-nav-btn" data-module="messages-broadcast" data-rbac="support,super">
          <i class="fas fa-bullhorn nav-icon"></i>
          <span>Broadcasts & SMS</span>
        </button>
        <button class="admin-nav-btn" data-module="inquiries" data-rbac="support,super">
          <i class="fas fa-envelope nav-icon"></i>
          <span>Inquiries</span>
        </button>
        <button class="admin-nav-btn" data-module="support" data-rbac="support,super">
          <i class="fas fa-ticket-alt nav-icon"></i>
          <span>Support Tickets</span>
        </button>
      </div>

      <!-- 7. Finance & M-Pesa / Daraja -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Finance & M-Pesa</div>
        <button class="admin-nav-btn" data-module="finance" data-rbac="finance,super">
          <i class="fas fa-wallet nav-icon"></i>
          <span>Transactions & Fees</span>
        </button>
        <button class="admin-nav-btn" data-module="mpesa-config" data-rbac="finance,super">
          <i class="fas fa-mobile-alt nav-icon"></i>
          <span>M-Pesa / Daraja Config</span>
        </button>
      </div>

      <!-- 8. Geography, Categories & Promotions -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Marketplace Config</div>
        <button class="admin-nav-btn" data-module="locations" data-rbac="content,super">
          <i class="fas fa-map-marker-alt nav-icon"></i>
          <span>Locations & Hierarchy</span>
        </button>
        <button class="admin-nav-btn" data-module="categories" data-rbac="content,super">
          <i class="fas fa-tags nav-icon"></i>
          <span>Categories</span>
        </button>
        <button class="admin-nav-btn" data-module="promotions" data-rbac="content,finance,super">
          <i class="fas fa-star nav-icon"></i>
          <span>Promotions & Featured</span>
        </button>
      </div>

      <!-- 9. Analytics, Administration & Audit -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">System & Security</div>
        <button class="admin-nav-btn" data-module="analytics" data-rbac="super,finance,listings">
          <i class="fas fa-chart-pie nav-icon"></i>
          <span>Analytics & Reports</span>
        </button>
        <button class="admin-nav-btn" data-module="adminUsers" data-rbac="super">
          <i class="fas fa-user-shield nav-icon"></i>
          <span>Admin RBAC</span>
        </button>
        <button class="admin-nav-btn" data-module="audit" data-rbac="super">
          <i class="fas fa-clipboard-list nav-icon"></i>
          <span>Audit Logs</span>
        </button>
        <button class="admin-nav-btn" data-module="system-settings" data-rbac="super">
          <i class="fas fa-cogs nav-icon"></i>
          <span>System Settings</span>
        </button>
        <button class="admin-nav-btn" data-module="backups" data-rbac="super">
          <i class="fas fa-database nav-icon"></i>
          <span>Database & Backups</span>
        </button>
      </div>
    </nav>
  </aside>
  <!-- Main Content Area -->
  <main class="admin-main">
    <!-- Enhanced Header -->
    <header class="admin-header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1 id="page-title">
          <i class="fas fa-chart-line"></i>
          Dashboard Overview
        </h1>
      </div>
      <!-- Admin Global Search Bar -->
      <div class="admin-global-search-container" id="admin-global-search-container">
        <div class="admin-search-input-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="admin-global-search-input" placeholder="Search users, listings, services, units... (Ctrl + K)" autocomplete="off">
          <button class="search-clear-btn" id="admin-search-clear-btn" style="display:none;" title="Clear search">&times;</button>
          <span class="search-key-badge">Ctrl K</span>
        </div>

        <!-- Floating Global Search Results Dropdown -->
        <div class="admin-search-dropdown" id="admin-search-dropdown" style="display: none;">
          <div class="search-category-filter" id="search-category-filter">
            <button class="search-filter-pill active" data-filter="all">All</button>
            <button class="search-filter-pill" data-filter="users"><i class="fas fa-users"></i> Users</button>
            <button class="search-filter-pill" data-filter="properties"><i class="fas fa-home"></i> Properties</button>
            <button class="search-filter-pill" data-filter="services"><i class="fas fa-tools"></i> Services</button>
            <button class="search-filter-pill" data-filter="marketplace"><i class="fas fa-shopping-bag"></i> Marketplace</button>
            <button class="search-filter-pill" data-filter="buildings"><i class="fas fa-building"></i> Buildings</button>
          </div>
          <div class="admin-search-results" id="admin-search-results">
            <div class="search-hint">Type at least 2 characters to search across KejaMarket...</div>
          </div>
        </div>
      </div>

      <div class="admin-user-info">
        <div class="user-details">
          <div id="admin-user-name" class="user-name">Administrator</div>
          <div id="admin-user-role" class="user-role">Admin</div>
        </div>
        <button class="admin-logout-btn btn-secondary" id="admin-logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <div class="admin-content" id="admin-content">
      <!-- Content loaded dynamically by admin-core.js -->
    </div>
  </main>
</div>

<!-- Admin System Scripts -->
<script src="js/admin-core.js?v=2.0"></script>
<script src="js/data/locations-master.js?v=1.0"></script>
<script src="js/admin-locations.js?v=1.0"></script>
<script src="js/admin-users.js?v=1.0"></script>
<script src="js/admin-properties.js?v=1.0"></script>
<script src="js/admin-verification.js?v=1.0"></script>
<script src="js/admin-buildings.js?v=1.0"></script>
<script src="js/admin-bnb.js?v=1.0"></script>
<script src="js/admin-operations.js?v=1.0"></script>
<script src="js/admin-hunts.js?v=1.0"></script>

<!-- Mobile Menu Toggle Script -->
<script>
(function() {
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const sidebar = document.getElementById('admin-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  
  if (mobileMenuToggle && sidebar && overlay) {
    // Toggle menu
    mobileMenuToggle.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    });
    
    // Close menu when overlay is clicked
    overlay.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    });
    
    // Close menu when navigation button is clicked
    const navButtons = document.querySelectorAll('.admin-nav-btn');
    navButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });
    });
  }
})();
</script>

</body>
</html>
