<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Block search engines from indexing internal admin system -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  
  <title>Admin Dashboard - Internal System</title>
  <link rel="stylesheet" href="css/style.css?v=3.1">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=2.1">
  <link rel="stylesheet" href="vendor/fonts/plus-jakarta-sans.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar Overlay for Mobile -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- Enhanced Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-header">
      <h2>
        <i class="fas fa-building"></i>
        KejaMarket Admin
      </h2>
    </div>
    
    <nav>
      <!-- Core Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Core Management</div>
        <button class="admin-nav-btn active" data-module="dashboard">
          <i class="fas fa-chart-line nav-icon"></i>
          <span>Dashboard</span>
        </button>
        
        <button class="admin-nav-btn" data-module="users">
          <i class="fas fa-users nav-icon"></i>
          <span>Users</span>
        </button>
      </div>
      
      <!-- Property Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Property Management</div>
        <button class="admin-nav-btn" data-module="properties">
          <i class="fas fa-home nav-icon"></i>
          <span>Properties</span>
        </button>
        
        <button class="admin-nav-btn" data-module="buildings">
          <i class="fas fa-building nav-icon"></i>
          <span>Buildings</span>
        </button>
        
        <button class="admin-nav-btn" data-module="units">
          <i class="fas fa-door-open nav-icon"></i>
          <span>Units</span>
        </button>
        
        <button class="admin-nav-btn" data-module="verification">
          <i class="fas fa-shield-check nav-icon"></i>
          <span>Verification</span>
        </button>
      </div>
      
      <!-- Business Operations -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Business Operations</div>
        <button class="admin-nav-btn" data-module="rentals">
          <i class="fas fa-key nav-icon"></i>
          <span>Rentals</span>
        </button>
        
        <button class="admin-nav-btn" data-module="bnb">
          <i class="fas fa-bed nav-icon"></i>
          <span>Short-Stays / BNB</span>
        </button>
        
        <button class="admin-nav-btn" data-module="services">
          <i class="fas fa-tools nav-icon"></i>
          <span>Services</span>
        </button>
        
        <button class="admin-nav-btn" data-module="marketplace">
          <i class="fas fa-shopping-cart nav-icon"></i>
          <span>Marketplace</span>
        </button>
      </div>
      
      <!-- Customer Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Customer Management</div>
        <button class="admin-nav-btn" data-module="inquiries">
          <i class="fas fa-envelope nav-icon"></i>
          <span>Inquiries</span>
        </button>
        
        <button class="admin-nav-btn" data-module="reviews">
          <i class="fas fa-star nav-icon"></i>
          <span>Reviews</span>
        </button>
        
        <button class="admin-nav-btn" data-module="support">
          <i class="fas fa-ticket-alt nav-icon"></i>
          <span>Support</span>
        </button>
        
        <button class="admin-nav-btn" data-module="house-hunts">
          <i class="fas fa-search-location nav-icon"></i>
          <span>House Hunts</span>
          <span class="admin-badge" id="admin-hunts-count" style="display:none; margin-left:auto; background:#10b981; color:#fff; border-radius:10px; padding:2px 7px; font-size:11px;">0</span>
        </button>
      </div>
      
      <!-- Risk & Security -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Risk & Security</div>
        <button class="admin-nav-btn" data-module="reports">
          <i class="fas fa-exclamation-triangle nav-icon"></i>
          <span>Reports & Complaints</span>
        </button>
        
        <button class="admin-nav-btn" data-module="risk">
          <i class="fas fa-shield-alt nav-icon"></i>
          <span>Risk & Fraud</span>
        </button>
        
        <button class="admin-nav-btn" data-module="audit">
          <i class="fas fa-clipboard-list nav-icon"></i>
          <span>Audit Logs</span>
        </button>
      </div>
      
      <!-- Analytics & Tools -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Analytics & Tools</div>
        <button class="admin-nav-btn" data-module="analytics">
          <i class="fas fa-chart-bar nav-icon"></i>
          <span>Analytics</span>
        </button>
        
        <button class="admin-nav-btn" data-module="finance">
          <i class="fas fa-dollar-sign nav-icon"></i>
          <span>Finance</span>
        </button>
        
        <button class="admin-nav-btn" data-module="adminUsers">
          <i class="fas fa-user-shield nav-icon"></i>
          <span>Admin Users</span>
        </button>
        
        <button class="admin-nav-btn" data-module="locations">
          <i class="fas fa-map-marker-alt nav-icon"></i>
          <span>Locations</span>
        </button>
      </div>

      <!-- Global Settings -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Global Settings</div>
        <button class="admin-nav-btn" data-module="global">
          <i class="fas fa-globe nav-icon"></i>
          <span>Site Config</span>
        </button>

        <button class="admin-nav-btn" data-module="featured">
          <i class="fas fa-star nav-icon"></i>
          <span>Featured Listings</span>
        </button>

        <button class="admin-nav-btn" data-module="notifications">
          <i class="fas fa-bell nav-icon"></i>
          <span>Notifications</span>
        </button>

        <button class="admin-nav-btn" data-module="appsettings">
          <i class="fas fa-cog nav-icon"></i>
          <span>App Settings</span>
        </button>
      </div>
    </nav>
  </aside>
  <!-- Main Content Area -->
  <main class="admin-main">
    <!-- Enhanced Header -->
    <header class="admin-header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1 id="page-title">
          <i class="fas fa-chart-line"></i>
          Dashboard Overview
        </h1>
      </div>
      <!-- Admin Global Search Bar -->
      <div class="admin-global-search-container" id="admin-global-search-container">
        <div class="admin-search-input-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="admin-global-search-input" placeholder="Search users, listings, services, units... (Ctrl + K)" autocomplete="off">
          <button class="search-clear-btn" id="admin-search-clear-btn" style="display:none;" title="Clear search">&times;</button>
          <span class="search-key-badge">Ctrl K</span>
        </div>

        <!-- Floating Global Search Results Dropdown -->
        <div class="admin-search-dropdown" id="admin-search-dropdown" style="display: none;">
          <div class="search-category-filter" id="search-category-filter">
            <button class="search-filter-pill active" data-filter="all">All</button>
            <button class="search-filter-pill" data-filter="users"><i class="fas fa-users"></i> Users</button>
            <button class="search-filter-pill" data-filter="properties"><i class="fas fa-home"></i> Properties</button>
            <button class="search-filter-pill" data-filter="services"><i class="fas fa-tools"></i> Services</button>
            <button class="search-filter-pill" data-filter="marketplace"><i class="fas fa-shopping-bag"></i> Marketplace</button>
            <button class="search-filter-pill" data-filter="buildings"><i class="fas fa-building"></i> Buildings</button>
          </div>
          <div class="admin-search-results" id="admin-search-results">
            <div class="search-hint">Type at least 2 characters to search across KejaMarket...</div>
          </div>
        </div>
      </div>

      <div class="admin-user-info">
        <div class="user-details">
          <div id="admin-user-name" class="user-name">Administrator</div>
          <div id="admin-user-role" class="user-role">Admin</div>
        </div>
        <button class="admin-logout-btn btn-secondary" id="admin-logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <div class="admin-content" id="admin-content">
      <!-- Content loaded dynamically by admin-core.js -->
    </div>
  </main>
</div>

<!-- Admin System Scripts -->
<script src="js/admin-core.js?v=2.0"></script>
<script src="js/admin-users.js?v=1.0"></script>
<script src="js/admin-properties.js?v=1.0"></script>
<script src="js/admin-verification.js?v=1.0"></script>
<script src="js/admin-buildings.js?v=1.0"></script>
<script src="js/admin-bnb.js?v=1.0"></script>
<script src="js/admin-operations.js?v=1.0"></script>
<script src="js/admin-hunts.js?v=1.0"></script>

<!-- Mobile Menu Toggle Script -->
<script>
(function() {
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const sidebar = document.getElementById('admin-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  
  if (mobileMenuToggle && sidebar && overlay) {
    // Toggle menu
    mobileMenuToggle.addEventListener('click', function() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    });
    
    // Close menu when overlay is clicked
    overlay.addEventListener('click', function() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    });
    
    // Close menu when navigation button is clicked
    const navButtons = document.querySelectorAll('.admin-nav-btn');
    navButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });
    });
  }
})();
</script>

</body>
</html>
