<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏢 KejaMarket Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=3.1">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
    
    .admin-layout { display: flex; height: 100vh; }
    
    /* Enhanced Sidebar */
    .admin-sidebar { 
      width: 280px; 
      background: linear-gradient(135deg, #1e1b4b, #312e81); 
      color: white; 
      padding: 20px; 
      overflow-y: auto; 
      border-right: 1px solid #4f46e5;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    
    .admin-sidebar h2 { 
      font-size: 1.4rem; 
      font-weight: 800; 
      margin-bottom: 28px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 2px solid rgba(124, 58, 237, 0.3);
    }
    
    .sidebar-section {
      margin-bottom: 24px;
    }
    
    .sidebar-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-left: 16px;
    }
    
    .admin-nav-btn { 
      background: transparent; 
      color: #e9d5ff; 
      border: none; 
      padding: 12px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.9rem; 
      text-align: left; 
      transition: all 0.2s; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      width: 100%;
      margin-bottom: 4px;
    }
    
    .admin-nav-btn:hover { 
      background: rgba(124, 58, 237, 0.4); 
      color: white;
      transform: translateX(4px);
    }
    
    .admin-nav-btn.active { 
      background: #7c3aed; 
      color: white; 
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }
    
    .nav-icon {
      width: 18px;
      text-align: center;
    }
    
    .admin-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Enhanced Header */
    .admin-header { 
      background: linear-gradient(135deg, #7c3aed, #4f46e5); 
      color: white; 
      padding: 20px 32px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    .admin-header h1 { 
      font-size: 1.6rem; 
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .admin-header-right { 
      display: flex; 
      gap: 20px; 
      align-items: center; 
    }
    
    .admin-logout-btn { 
      background: rgba(255,255,255,0.2); 
      color: white; 
      border: 1px solid rgba(255,255,255,0.4); 
      padding: 10px 18px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .admin-content { 
      flex: 1; 
      overflow-y: auto; 
      padding: 32px; 
      background: #f8fafc;
    }
    
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; 
      margin-bottom: 32px; 
    }
    
    .stat-card { 
      background: white; 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 24px; 
      text-align: center; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }
    
    .stat-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }
    
    .stat-value { 
      font-size: 2.2rem; 
      font-weight: 800; 
      color: #4f46e5;
      margin-bottom: 8px;
    }
    
    .stat-label { 
      font-size: 0.9rem; 
      color: #64748b; 
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <!-- Enhanced Sidebar -->
  <aside class="admin-sidebar">
    <h2>
      <i class="fas fa-building"></i>
      KejaMarket Admin
    </h2>
    
    <nav>
      <!-- Core Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Core Management</div>
        <button class="admin-nav-btn active" data-module="dashboard">
          <i class="fas fa-chart-line nav-icon"></i>
          <span>Dashboard</span>
        </button>
        
        <button class="admin-nav-btn" data-module="users">
          <i class="fas fa-users nav-icon"></i>
          <span>Users</span>
        </button>
      </div>
      
      <!-- Property Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Property Management</div>
        <button class="admin-nav-btn" data-module="properties">
          <i class="fas fa-home nav-icon"></i>
          <span>Properties</span>
        </button>
        
        <button class="admin-nav-btn" data-module="buildings">
          <i class="fas fa-building nav-icon"></i>
          <span>Buildings</span>
        </button>
        
        <button class="admin-nav-btn" data-module="units">
          <i class="fas fa-door-open nav-icon"></i>
          <span>Units</span>
        </button>
        
        <button class="admin-nav-btn" data-module="verification">
          <i class="fas fa-shield-check nav-icon"></i>
          <span>Verification</span>
        </button>
      </div>
      
      <!-- Business Operations -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Business Operations</div>
        <button class="admin-nav-btn" data-module="rentals">
          <i class="fas fa-key nav-icon"></i>
          <span>Rentals</span>
        </button>
        
        <button class="admin-nav-btn" data-module="bnb">
          <i class="fas fa-bed nav-icon"></i>
          <span>Short-Stays / BNB</span>
        </button>
        
        <button class="admin-nav-btn" data-module="services">
          <i class="fas fa-tools nav-icon"></i>
          <span>Services</span>
        </button>
        
        <button class="admin-nav-btn" data-module="marketplace">
          <i class="fas fa-shopping-cart nav-icon"></i>
          <span>Marketplace</span>
        </button>
      </div>
      
      <!-- Customer Management -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Customer Management</div>
        <button class="admin-nav-btn" data-module="inquiries">
          <i class="fas fa-envelope nav-icon"></i>
          <span>Inquiries</span>
        </button>
        
        <button class="admin-nav-btn" data-module="reviews">
          <i class="fas fa-star nav-icon"></i>
          <span>Reviews</span>
        </button>
        
        <button class="admin-nav-btn" data-module="support">
          <i class="fas fa-ticket-alt nav-icon"></i>
          <span>Support</span>
        </button>
      </div>
      
      <!-- Risk & Security -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Risk & Security</div>
        <button class="admin-nav-btn" data-module="reports">
          <i class="fas fa-exclamation-triangle nav-icon"></i>
          <span>Reports & Complaints</span>
        </button>
        
        <button class="admin-nav-btn" data-module="risk">
          <i class="fas fa-shield-alt nav-icon"></i>
          <span>Risk & Fraud</span>
        </button>
        
        <button class="admin-nav-btn" data-module="audit">
          <i class="fas fa-clipboard-list nav-icon"></i>
          <span>Audit Logs</span>
        </button>
      </div>
      
      <!-- Analytics & Tools -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Analytics & Tools</div>
        <button class="admin-nav-btn" data-module="analytics">
          <i class="fas fa-chart-bar nav-icon"></i>
          <span>Analytics</span>
        </button>
        
        <button class="admin-nav-btn" data-module="finance">
          <i class="fas fa-dollar-sign nav-icon"></i>
          <span>Finance</span>
        </button>
        
        <button class="admin-nav-btn" data-module="adminUsers">
          <i class="fas fa-user-shield nav-icon"></i>
          <span>Admin Users</span>
        </button>
        
        <button class="admin-nav-btn" data-module="locations">
          <i class="fas fa-map-marker-alt nav-icon"></i>
          <span>Locations</span>
        </button>
      </div>
    </nav>
  </aside>
  <!-- Main Content Area -->
  <main class="admin-main">
    <!-- Enhanced Header -->
    <header class="admin-header">
      <h1 id="page-title">
        <i class="fas fa-chart-line"></i>
        Dashboard Overview
      </h1>
      <div class="admin-header-right">
        <div style="text-align: right;">
          <div id="admin-user-name" style="font-weight: 700;">Administrator</div>
          <div id="admin-user-role" style="font-size: 0.85rem; opacity: 0.9;">Admin</div>
        </div>
        <button class="admin-logout-btn" id="admin-logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <div class="admin-content" id="admin-content">
      <!-- Content loaded dynamically by admin-core.js -->
    </div>
  </main>
</div>

<!-- Admin System Scripts -->
<script src="js/admin-core.js?v=1.0"></script>
<script src="js/admin-users.js?v=1.0"></script>
<script src="js/admin-properties.js?v=1.0"></script>

</body>
</html>
