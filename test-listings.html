<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Listings - KejaMarket</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    .property-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .property-card h3 { margin: 0 0 10px 0; color: #16a34a; }
    .property-card p { margin: 5px 0; color: #666; }
    .error { background: #fee; border: 1px solid #fcc; padding: 15px; border-radius: 8px; color: #c00; }
    .success { background: #efe; border: 1px solid #cfc; padding: 15px; border-radius: 8px; color: #060; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏠 KejaMarket Listings Test</h1>
    <p>Testing API connection and property data loading...</p>
    
    <div id="status" class="loading">⏳ Loading properties from API...</div>
    <div id="properties"></div>
  </div>

  <script>
    async function testAPI() {
      const statusEl = document.getElementById('status');
      const propsEl = document.getElementById('properties');
      
      try {
        const response = await fetch('/api/properties');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        // Handle different response formats
        let properties = [];
        if (data.properties && Array.isArray(data.properties)) {
          properties = data.properties;
        } else if (data.data && Array.isArray(data.data)) {
          properties = data.data;
        } else if (Array.isArray(data)) {
          properties = data;
        }
        
        if (properties.length === 0) {
          statusEl.className = 'error';
          statusEl.innerHTML = '❌ No properties found in API response';
          console.error('Empty properties array', data);
          return;
        }
        
        // Success!
        statusEl.className = 'success';
        statusEl.innerHTML = `✅ Successfully loaded ${properties.length} properties from API`;
        
        // Display first 10 properties
        propsEl.innerHTML = properties.slice(0, 10).map(p => `
          <div class="property-card">
            <h3>${p.title || 'Untitled Property'}</h3>
            <p><strong>ID:</strong> ${p.id || 'N/A'}</p>
            <p><strong>Location:</strong> ${p.locationDisplay || p.estateSuburb || p.county || 'N/A'}</p>
            <p><strong>Rent:</strong> KES ${(p.rentKes || p.rent || 0).toLocaleString()}/month</p>
            <p><strong>Bedrooms:</strong> ${p.bedrooms || 0} | <strong>Bathrooms:</strong> ${p.bathrooms || 0}</p>
            <p><strong>Category:</strong> ${p.category || 'N/A'}</p>
            <p><strong>Status:</strong> ${p.status || 'N/A'} | <strong>Verified:</strong> ${p.isVerified || p.isApproved ? 'Yes' : 'No'}</p>
          </div>
        `).join('');
        
        console.log('✅ Properties loaded:', properties);
        
      } catch (error) {
        statusEl.className = 'error';
        statusEl.innerHTML = `❌ Error loading properties: ${error.message}`;
        console.error('API Error:', error);
      }
    }
    
    // Run test on page load
    testAPI();
  </script>
</body>
</html>
