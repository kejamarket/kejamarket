services:
  - type: web
    name: kejamarket
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Add your other env vars from .env here
    healthCheckPath: /health
    autoDeploy: true
