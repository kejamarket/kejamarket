services:
  - type: web
    name: kejamarket
    runtime: node
    buildCommand: npm ci --only=production
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: kejamarket-db
      mountPath: /app/db
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_PAYBILL
        value: '303030'
      - key: MPESA_ACCOUNT
        value: '2057103992'
      - key: MPESA_CALLBACK_URL
        value: https://kejamarket.onrender.com/api/mpesa/callback
      - key: MPESA_ENV
        value: sandbox
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        value: KejaMarket
